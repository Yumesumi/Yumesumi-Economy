modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="Yumesumi Arikki"
description='''Adds four stackable Yumesumi coins as configurable monster drops.

Copper, Silver, Gold, and Diamond Coins can be exchanged at an 8:1 rate through crafting recipes or by right-clicking while held. Sneak-right-click decomposes coins back down the same chain.

添加铜币、银币、金币、钻石币四种可堆叠梦澄币，可作为可配置的怪物掉落。

梦澄币支持通过合成表或手持右键按 8:1 向上兑换，潜行右键可沿同一兑换链向下分解。
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
